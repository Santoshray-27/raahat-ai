
services:
  - type: web
    name: raahat-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: ENVIRONMENT
        value: production
      - key: USE_MOCKS
        value: "False"
      - key: LLM_PROVIDER_ORDER
        value: gemini,sarvam,groq
      - key: DATABASE_URL
        sync: false
      - key: GEOAPIFY_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: SARVAM_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: FIREBASE_CREDENTIALS_JSON
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: AUTH_DISABLED
        value: "False"

